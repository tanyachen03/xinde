<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数析学院 - 课程中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0A0A;
            color: #E0E0E0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        /* 导航栏 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: #1E1E1E;
            border-radius: 12px;
            margin-bottom: 32px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #58A6FF;
        }
        .nav-links {
            display: flex;
            gap: 32px;
        }
        .nav-links a {
            color: #E0E0E0;
            text-decoration: none;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            background: #2C974B;
            color: white;
        }
        .login-btn {
            background: #2C974B;
            padding: 8px 24px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        /* 页面标题 */
        .page-title {
            text-align: center;
            margin-bottom: 32px;
        }
        .page-title h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .page-title p {
            color: #B0B0B0;
        }
        /* 课程网格 */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        /* 课程卡片 */
        .course-card {
            background: #1E1E1E;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #2D2D2D;
        }
        .course-card:hover {
            transform: translateY(-4px);
            border-color: #58A6FF;
            background: #252525;
        }
        .course-emoji {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .course-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
            color: white;
        }
        .course-desc {
            color: #B0B0B0;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .course-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .difficulty {
            padding: 4px 12px;
            border-radius: 20px;
            background: #2D2D2D;
        }
        .difficulty.beginner { background: #2C974B; color: white; }
        .difficulty.intermediate { background: #D68A1C; color: white; }
        .difficulty.advanced { background: #DA3633; color: white; }
        .progress-text {
            color: #58A6FF;
        }
        .progress-bar {
            height: 6px;
            background: #2D2D2D;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #2C974B;
            width: 0%;
            transition: width 0.3s;
        }
        /* 小节列表（点击卡片后展开） */
        .lessons-container {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #2D2D2D;
            display: none;
        }
        .lessons-container.open {
            display: block;
        }
        .lesson-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: #252525;
            transition: all 0.2s;
        }
        .lesson-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .lesson-status {
            font-size: 18px;
            width: 28px;
            text-align: center;
        }
        .lesson-status.completed {
            color: #2C974B;
        }
        .lesson-name {
            flex: 1;
        }
        .lesson-duration {
            color: #B0B0B0;
            font-size: 12px;
        }
        .complete-btn {
            background: #2C974B;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .complete-btn:hover {
            background: #36b153;
        }
        .complete-btn.done {
            background: #2D2D2D;
            color: #B0B0B0;
            cursor: default;
        }
        @media (max-width: 700px) {
            .courses-grid { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; gap: 16px; }
            .nav-links { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">📊 数析学院</div>
    <div class="nav-links">
        <a>首页</a>
        <a class="active">课程中心</a>
        <a>实战项目</a>
        <a>成就殿堂</a>
    </div>
    <div class="login-btn">登录</div>
</div>

<div class="page-title">
    <h1>📚 课程中心</h1>
    <p>选择你感兴趣的课程，点击卡片展开小节列表</p>
</div>

<div class="courses-grid" id="coursesGrid"></div>

<script>
    // ==================== 课程数据 ====================
    const coursesData = [
        {
            id: 0,
            emoji: "🐍",
            title: "Python基础入门",
            desc: "从零开始掌握Python编程基础",
            difficulty: "beginner",
            difficultyText: "入门",
            lessons: [
                { name: "Python安装与环境配置", duration: "15分钟", completed: false },
                { name: "变量与数据类型", duration: "20分钟", completed: false },
                { name: "条件判断if-else", duration: "20分钟", completed: false },
                { name: "循环语句for/while", duration: "25分钟", completed: false },
                { name: "列表与元组", duration: "20分钟", completed: false },
                { name: "字典与集合", duration: "20分钟", completed: false },
                { name: "函数定义与调用", duration: "25分钟", completed: false },
                { name: "模块与包导入", duration: "15分钟", completed: false }
            ]
        },
        {
            id: 1,
            emoji: "📊",
            title: "Pandas入门",
            desc: "数据分析的核心工具Pandas",
            difficulty: "beginner",
            difficultyText: "入门",
            lessons: [
                { name: "Pandas安装与Series", duration: "15分钟", completed: false },
                { name: "DataFrame创建与查看", duration: "20分钟", completed: false },
                { name: "数据读取与写入", duration: "20分钟", completed: false },
                { name: "数据筛选与过滤", duration: "25分钟", completed: false },
                { name: "缺失值处理", duration: "20分钟", completed: false },
                { name: "分组聚合groupby", duration: "25分钟", completed: false }
            ]
        },
        {
            id: 2,
            emoji: "🧹",
            title: "数据清洗",
            desc: "脏数据到干净数据的转化",
            difficulty: "intermediate",
            difficultyText: "进阶",
            lessons: [
                { name: "缺失值识别与统计", duration: "15分钟", completed: false },
                { name: "fillna填充方法", duration: "20分钟", completed: false },
                { name: "dropna删除缺失值", duration: "15分钟", completed: false },
                { name: "重复值检测与删除", duration: "15分钟", completed: false },
                { name: "异常值识别", duration: "20分钟", completed: false },
                { name: "数据类型转换", duration: "15分钟", completed: false },
                { name: "数据标准化与归一化", duration: "20分钟", completed: false }
            ]
        },
        {
            id: 3,
            emoji: "📈",
            title: "数据可视化",
            desc: "让数据说话的艺术",
            difficulty: "intermediate",
            difficultyText: "进阶",
            lessons: [
                { name: "matplotlib基础绘图", duration: "15分钟", completed: false },
                { name: "折线图与散点图", duration: "20分钟", completed: false },
                { name: "柱状图与直方图", duration: "20分钟", completed: false },
                { name: "饼图与箱线图", duration: "20分钟", completed: false },
                { name: "子图与布局", duration: "15分钟", completed: false },
                { name: "图表美化与保存", duration: "15分钟", completed: false }
            ]
        }
    ];

    // 从 localStorage 加载进度
    function loadProgress() {
        const saved = localStorage.getItem("courseProgress");
        if (saved) {
            const progress = JSON.parse(saved);
            for (let cId in progress) {
                if (coursesData[cId]) {
                    coursesData[cId].lessons.forEach((lesson, lIdx) => {
                        lesson.completed = progress[cId]?.[lIdx] || false;
                    });
                }
            }
        }
    }

    // 保存进度到 localStorage
    function saveProgress() {
        const progress = {};
        coursesData.forEach((course, cId) => {
            progress[cId] = course.lessons.map(l => l.completed);
        });
        localStorage.setItem("courseProgress", JSON.stringify(progress));
    }

    // 计算已完成小节数
    function getCompletedCount(course) {
        return course.lessons.filter(l => l.completed).length;
    }

    // 渲染所有课程
    function renderCourses() {
        const grid = document.getElementById("coursesGrid");
        grid.innerHTML = "";
        coursesData.forEach((course, idx) => {
            const completedCount = getCompletedCount(course);
            const totalCount = course.lessons.length;
            const percent = (completedCount / totalCount) * 100;
            const card = document.createElement("div");
            card.className = "course-card";
            card.innerHTML = `
                <div class="course-emoji">${course.emoji}</div>
                <div class="course-title">${course.title}</div>
                <div class="course-desc">${course.desc}</div>
                <div class="course-meta">
                    <span class="difficulty ${course.difficulty}">${course.difficultyText}</span>
                    <span class="progress-text">已完成 ${completedCount}/${totalCount} 小节</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${percent}%;"></div>
                </div>
                <div class="lessons-container" data-course="${idx}">
                    ${renderLessons(course, idx)}
                </div>
            `;
            grid.appendChild(card);
        });
        // 绑定卡片点击事件（展开/收起）
        document.querySelectorAll(".course-card").forEach((card, cardIdx) => {
            const lessonsDiv = card.querySelector(".lessons-container");
            card.addEventListener("click", (e) => {
                // 防止点到按钮时触发卡片关闭
                if (e.target.classList.contains("complete-btn")) return;
                lessonsDiv.classList.toggle("open");
            });
        });
        // 绑定完成按钮事件
        document.querySelectorAll(".complete-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const courseId = parseInt(btn.dataset.course);
                const lessonId = parseInt(btn.dataset.lesson);
                if (coursesData[courseId] && coursesData[courseId].lessons[lessonId]) {
                    const lesson = coursesData[courseId].lessons[lessonId];
                    if (!lesson.completed) {
                        lesson.completed = true;
                        saveProgress();
                        renderCourses(); // 重新渲染更新UI
                    }
                }
            });
        });
    }

    function renderLessons(course, courseId) {
        let html = '<div style="margin-top: 12px;">';
        course.lessons.forEach((lesson, lIdx) => {
            const statusIcon = lesson.completed ? "✅" : "⭕";
            html += `
                <div class="lesson-item">
                    <div class="lesson-info">
                        <span class="lesson-status ${lesson.completed ? 'completed' : ''}">${statusIcon}</span>
                        <span class="lesson-name">${lesson.name}</span>
                        <span class="lesson-duration">${lesson.duration}</span>
                    </div>
                    <button class="complete-btn ${lesson.completed ? 'done' : ''}" data-course="${courseId}" data-lesson="${lIdx}" ${lesson.completed ? 'disabled' : ''}>
                        ${lesson.completed ? '已完成' : '✓ 标记完成'}
                    </button>
                </div>
            `;
        });
        html += '</div>';
        return html;
    }

    // 初始化
    loadProgress();
    renderCourses();
</script>
</body>
</html>
