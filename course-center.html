<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数析学院 - 课程中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0A0A;
            color: #E0E0E0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        /* 导航栏 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: #1E1E1E;
            border-radius: 12px;
            margin-bottom: 32px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #58A6FF;
        }
        .nav-links {
            display: flex;
            gap: 32px;
        }
        .nav-links a {
            color: #E0E0E0;
            text-decoration: none;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            background: #2C974B;
            color: white;
        }
        .login-btn {
            background: #2C974B;
            padding: 8px 24px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        /* 页面标题 */
        .page-title {
            text-align: center;
            margin-bottom: 32px;
        }
        .page-title h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .page-title p {
            color: #B0B0B0;
        }
        /* 课程网格 */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        /* 课程卡片 */
        .course-card {
            background: #1E1E1E;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #2D2D2D;
        }
        .course-card:hover {
            transform: translateY(-4px);
            border-color: #58A6FF;
            background: #252525;
        }
        .course-emoji {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .course-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
            color: white;
        }
        .course-desc {
            color: #B0B0B0;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .course-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .difficulty {
            padding: 4px 12px;
            border-radius: 20px;
            background: #2D2D2D;
        }
        .difficulty.beginner { background: #2C974B; color: white; }
        .difficulty.intermediate { background: #D68A1C; color: white; }
        .difficulty.advanced { background: #DA3633; color: white; }
        .progress-text {
            color: #58A6FF;
        }
        .progress-bar {
            height: 6px;
            background: #2D2D2D;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #2C974B;
            width: 0%;
            transition: width 0.3s;
        }
        /* 小节列表（点击卡片后展开） */
        .lessons-container {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #2D2D2D;
            display: none;
        }
        .lessons-container.open {
            display: block;
        }
        .lesson-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: #252525;
            transition: all 0.2s;
            cursor: pointer;
        }
        .lesson-item:hover {
            background: #2D2D2D;
        }
        .lesson-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .lesson-status {
            font-size: 18px;
            width: 28px;
            text-align: center;
        }
        .lesson-status.completed {
            color: #2C974B;
        }
        .lesson-name {
            flex: 1;
        }
        .lesson-duration {
            color: #B0B0B0;
            font-size: 12px;
        }
        .complete-btn {
            background: #2C974B;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .complete-btn:hover {
            background: #36b153;
        }
        .complete-btn.done {
            background: #2D2D2D;
            color: #B0B0B0;
            cursor: default;
        }
        /* 小节详情页 */
        .lesson-detail-page {
            display: none;
            max-width: 900px;
            margin: 0 auto;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1E1E1E;
            border: 1px solid #2D2D2D;
            color: #E0E0E0;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 24px;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: #252525;
            border-color: #58A6FF;
        }
        .detail-header {
            background: #1E1E1E;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid #2D2D2D;
        }
        .detail-header h1 {
            font-size: 28px;
            margin-bottom: 12px;
            color: white;
        }
        .detail-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        .detail-meta span {
            color: #B0B0B0;
        }
        .mark-complete-btn {
            margin-left: auto;
            background: #2C974B;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .mark-complete-btn:hover {
            background: #36b153;
        }
        .mark-complete-btn.done {
            background: #2D2D2D;
            color: #B0B0B0;
            cursor: default;
        }
        .content-section {
            background: #1E1E1E;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #2D2D2D;
        }
        .content-section h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .content-section p {
            color: #E0E0E0;
            line-height: 1.8;
            margin-bottom: 12px;
        }
        .content-section ul, .content-section ol {
            margin-left: 24px;
            color: #E0E0E0;
            line-height: 2;
        }
        .tip-box {
            background: rgba(44, 151, 75, 0.1);
            border-left: 4px solid #2C974B;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .tip-box h3 {
            color: #2C974B;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .error-box {
            background: rgba(218, 54, 51, 0.1);
            border-left: 4px solid #DA3633;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .error-box h3 {
            color: #DA3633;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .question-box {
            background: rgba(88, 166, 255, 0.1);
            border-left: 4px solid #58A6FF;
            padding: 16px;
            border-radius: 8px;
        }
        .question-box h3 {
            color: #58A6FF;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .code-editor-container {
            background: #1E1E1E;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2D2D2D;
        }
        .editor-toolbar {
            background: #252525;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2D2D2D;
        }
        .run-btn {
            background: #2C974B;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .run-btn:hover {
            background: #36b153;
        }
        .editor-textarea {
            width: 100%;
            min-height: 200px;
            background: #0A0A0A;
            color: #E0E0E0;
            border: none;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
        }
        .output-area {
            background: #0A0A0A;
            border-top: 1px solid #2D2D2D;
            padding: 16px;
            min-height: 80px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            color: #2C974B;
        }
        @media (max-width: 700px) {
            .courses-grid { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; gap: 16px; }
            .nav-links { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">📊 数析学院</div>
    <div class="nav-links">
        <a>首页</a>
        <a class="active">课程中心</a>
        <a>实战项目</a>
        <a>成就殿堂</a>
    </div>
    <div class="login-btn">登录</div>
</div>

<div id="courses-page">
    <div class="page-title">
        <h1>📚 课程中心</h1>
        <p>选择你感兴趣的课程，点击卡片展开小节列表，再点击小节名称开始学习</p>
    </div>

    <div class="courses-grid" id="coursesGrid"></div>
</div>

<div id="lesson-detail-page" class="lesson-detail-page">
</div>

<script>

                    content: {
                        explanation: `变量是存储数据的容器，就像一个个盒子，可以放入不同的内容。

Python主要数据类型：
- 整数 (int): 没有小数的数字，如 1, 100, -5
- 浮点数 (float): 带小数的数字，如 3.14, 2.5, -0.5

- < 小于

- <= 小于等于

if-else结构：

age = 20

print(f"成绩等级: {grade}")

# 逻辑运算符

has_homework = False

else:

    // 从 localStorage 加载进度
    function loadProgress() {
        const saved = localStorage.getItem("courseProgress");
        if (saved) {
            const progress = JSON.parse(saved);
            for (let cId in progress) {
                if (coursesData[cId]) {
                    coursesData[cId].lessons.forEach((lesson, lIdx) => {
                        lesson.completed = progress[cId]?.[lIdx] || false;
                    });
                }
            }
        }
    }

    // 保存进度到 localStorage
    function saveProgress() {
        const progress = {};
        coursesData.forEach((course, cId) => {
            progress[cId] = course.lessons.map(l => l.completed);
        });
        localStorage.setItem("courseProgress", JSON.stringify(progress));
    }

    // 计算已完成小节数
    function getCompletedCount(course) {
        return course.lessons.filter(l => l.completed).length;
    }

    // 渲染课程列表页面
    function renderCoursesPage() {
        const grid = document.getElementById("coursesGrid");
        grid.innerHTML = "";
        coursesData.forEach((course, idx) => {
            const completedCount = getCompletedCount(course);
            const totalCount = course.lessons.length;
            const percent = (completedCount / totalCount) * 100;
            const card = document.createElement("div");
            card.className = "course-card";
            card.innerHTML = `
                <div class="course-emoji">${course.emoji}</div>
                <div class="course-title">${course.title}</div>
                <div class="course-desc">${course.desc}</div>
                <div class="course-meta">
                    <span class="difficulty ${course.difficulty}">${course.difficultyText}</span>
                    <span class="progress-text">已完成 ${completedCount}/${totalCount} 小节</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${percent}%;"></div>
                </div>
                <div class="lessons-container" data-course="${idx}">
                    ${renderLessonsList(course, idx)}
                </div>
            `;
            grid.appendChild(card);
        });
        // 绑定卡片点击事件（展开/收起）
        document.querySelectorAll(".course-card").forEach((card, cardIdx) => {
            const lessonsDiv = card.querySelector(".lessons-container");
            card.addEventListener("click", (e) => {
                if (e.target.closest(".lesson-item")) return;
                if (e.target.classList.contains("complete-btn")) return;
                lessonsDiv.classList.toggle("open");
            });
        });
        // 绑定小节点击事件
        document.querySelectorAll(".lesson-item").forEach(item => {
            item.addEventListener("click", (e) => {
                if (e.target.classList.contains("complete-btn")) {
                    e.stopPropagation();
                    return;
                }
                const courseId = parseInt(item.dataset.course);
                const lessonId = parseInt(item.dataset.lesson);
                showLessonDetail(courseId, lessonId);
            });
        });
        // 绑定完成按钮事件
        document.querySelectorAll(".complete-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const courseId = parseInt(btn.dataset.course);
                const lessonId = parseInt(btn.dataset.lesson);
                if (coursesData[courseId] && coursesData[courseId].lessons[lessonId]) {
                    const lesson = coursesData[courseId].lessons[lessonId];
                    if (!lesson.completed) {
                        lesson.completed = true;
                        saveProgress();
                        renderCoursesPage();
                    }
                }
            });
        });
    }

    function renderLessonsList(course, courseId) {
        let html = '<div style="margin-top: 12px;">';
        course.lessons.forEach((lesson, lIdx) => {
            const statusIcon = lesson.completed ? "✅" : "⭕";
            html += `
                <div class="lesson-item" data-course="${courseId}" data-lesson="${lIdx}">
                    <div class="lesson-info">
                        <span class="lesson-status ${lesson.completed ? 'completed' : ''}">${statusIcon}</span>
                        <span class="lesson-name">${lesson.name}</span>
                        <span class="lesson-duration">${lesson.duration}</span>
                    </div>
                    <button class="complete-btn ${lesson.completed ? 'done' : ''}" data-course="${courseId}" data-lesson="${lIdx}" ${lesson.completed ? 'disabled' : ''}>
                        ${lesson.completed ? '已完成' : '✓'}
                    </button>
                </div>
            `;
        });
        html += '</div>';
        return html;
    }

    // 显示小节详情页
    function showLessonDetail(courseId, lessonId) {
        const course = coursesData[courseId];
        const lesson = course.lessons[lessonId];
        
        document.getElementById("courses-page").style.display = "none";
        document.getElementById("lesson-detail-page").style.display = "block";
        
        window.location.hash = `#lesson/${courseId}/${lessonId}`;
        
        renderLessonDetail(courseId, lessonId);
    }

    // 返回课程列表
    function backToCourses() {
        document.getElementById("courses-page").style.display = "block";
        document.getElementById("lesson-detail-page").style.display = "none";
        window.location.hash = "";
        renderCoursesPage();
    }

print("Hello, Python!")</textarea>

                </div>

        `;
    }

    // 切换小节完成状态（详情页）
    function toggleLessonComplete(courseId, lessonId) {
        const lesson = coursesData[courseId].lessons[lessonId];
        lesson.completed = !lesson.completed;
        saveProgress();
        renderLessonDetail(courseId, lessonId);
    }

    // 模拟运行代码
    function runCode() {
        const output = document.getElementById("code-output");
        const code = document.getElementById("code-editor").value;
        output.textContent = "⏳ 正在运行...";
        
        setTimeout(() => {
            if (code.includes("print")) {
                if (code.includes("Python版本")) {
                    output.textContent = "Python版本: 3.9.7\n🎉 恭喜！Python环境已配置成功！";
                } else if (code.includes("成绩等级")) {
                    output.textContent = "🎂 你是成年人了！\n成绩等级: 良好\n📚 先学习吧~";
                } else {
                    output.textContent = "✅ 代码运行成功！\n(实际执行需要Python环境)";
                }
            } else {
                output.textContent = "✅ 代码运行成功！";
            }
        }, 500);
    }

    function runCode2() {

        output.textContent = "⏳ 正在运行...";
        
        setTimeout(() => {
            output.textContent = "✅ 代码运行成功！\n(完整功能需要后端支持)";
        }, 500);
    }

    // 初始化
    loadProgress();
    
    // 处理hash路由
    function handleHash() {
        const hash = window.location.hash;
        if (hash.startsWith("#lesson/")) {
            const parts = hash.split("/");
            const courseId = parseInt(parts[1]);
            const lessonId = parseInt(parts[2]);
            showLessonDetail(courseId, lessonId);
        } else {
            backToCourses();
        }
    }
    
    window.addEventListener("hashchange", handleHash);
    handleHash();
